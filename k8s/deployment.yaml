apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-scoring-service
  labels:
    app: credit-scoring-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: credit-scoring-service
  template:
    metadata:
      labels:
        app: credit-scoring-service
    spec:
      containers:
        - name: api
          image: credit-scoring-service:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
